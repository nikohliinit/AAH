spring.profiles.active=local
spring.application.name=tms-shipment-load
server.servlet.context-path=/tms-shipment-load/
########################Publish Shipment Confluent kafka configurations############################
#managed
kafka.mode=${KAFKA_MODE}
vsp.shipment.integration.route=direct:vspShipmentIntegrationRoute
shipment.request.consumer.topic=${SHIPMENT_KAFKA_CONSUMER_TOPIC}
shipment.request.consumer.group-id=${VSP_SHIPMENT_GROUP_ID}
spring.kafka.consumer.auto-offset-reset = latest
spring.kafka.properties.ssl.truststore.type=JKS
confluent.kafka.bootstrap-servers=${CONFLUENT_KAFKA_BOOTSTRAP_SERVER}
confluent.kafka.properties.sasl.mechanism=${CONFLUENT_KAFKA_SASL_MECHANISM}
confluent.kafka.properties.security.protocol=${CONFLUENT_KAFKA_SECURITY_PROTOCOL}
confluent.kafka.consumer.auto-offset-reset=${CONFLUENT_KAFKA_AUTO_OFFSET_RESET}
confluent.shipment.request.consumer.topic=${CONFLUENT_SHIPMENT_KAFKA_CONSUMER_TOPIC}
confluent.shipment.request.consumer.group-id=${CONFLUENT_VSP_SHIPMENT_GROUP_ID}
confluent.kafka.properties.ssl.truststore.type=${CONFLUENT_KAFKA_TRUSTSTORE_TYPE}
confluent.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${CONFLUENT_SASL_USERNAME}" password="${CONFLUENT_SASL_PASSWORD}";
shipment.consumer.route=${camel.component}:${shipment.request.consumer.topic}?brokers=${spring.kafka.bootstrap-servers}&groupId=${shipment.request.consumer.group-id}&autoOffsetReset=${spring.kafka.consumer.auto-offset-reset}&securityProtocol=${spring.kafka.properties.security.protocol}&sslTruststoreLocation=${spring.kafka.properties.ssl.truststore.location}&sslTruststorePassword=${spring.kafka.properties.ssl.truststore.password}&sslTruststoreType=${spring.kafka.properties.ssl.truststore.type}&saslJaasConfig=${spring.kafka.properties.sasl.jaas.config}&saslMechanism=${spring.kafka.properties.sasl.mechanism}&maxPollRecords=${max.poll.records}&maxPollIntervalMs=${max.poll.interval.ms}&consumersCount=${spring.kafka.consumer.concurrentConsumers}&reconnectBackoffMs=1000&reconnectBackoffMaxMs=5000&retryBackoffMs=2000
confluent.shipment.consumer.route=${camel.component}:${confluent.shipment.request.consumer.topic}?brokers=${confluent.kafka.bootstrap-servers}&groupId=${confluent.shipment.request.consumer.group-id}&autoOffsetReset=${confluent.kafka.consumer.auto-offset-reset}&securityProtocol=${confluent.kafka.properties.security.protocol}&sslTruststoreType=${confluent.kafka.properties.ssl.truststore.type}&saslJaasConfig=${confluent.kafka.properties.sasl.jaas.config}&saslMechanism=${confluent.kafka.properties.sasl.mechanism}&maxPollRecords=${max.poll.records}&maxPollIntervalMs=${max.poll.interval.ms}&consumersCount=${spring.kafka.consumer.concurrentConsumers}
camel.component=kafka
camel.config.enable=true
############### Logging configuration ###############

logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.apache.http=ERROR
logging.path=/


#Actuator
endpoints.health.id=health
endpoints.health.sensitive=false
endpoints.health.enabled=true

endpoints.info.id=info
endpoints.info.sensitive=false
endpoints.info.enabled=true

endpoints.actuator.id=actuator
endpoints.actuator.sensitive=false
endpoints.actuator.enabled=true

management.security.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,env, prometheus,refresh
management.endpoint.health.show-details=always
management.endpoint.env.show-values=ALWAYS
management.endpoint.configprops.show-values=ALWAYS

# Depth of details exposed by camel-health check. Pass any one of value (full, default, oneline)
camel.health.exposure-level = full
########################Pubsub for audit feedback######################
gcp.pubsub.audit.feedback.publish.camel.route=google-pubsub://${spring.cloud.gcp.audit.feedback.project-id}:${audit.feedback.publish.topic}
audit.feedback.trailer.image.publish.camel.route=google-pubsub://${spring.cloud.gcp.trailer.audit.feedback.project-id}:${trailer.image.audit.feedback.publish.topic}
audit.feedback.dock.door.audit.publish.camel.route==google-pubsub://${spring.cloud.gcp.dock.door.audit.feedback.project-id}:${dock.door.audit.feedback.publish.topic}
spring.main.banner-mode=off

####### create shipment load controller config ###########
create.shipment.load.controller.enable=false

#####Pubsub topic for LTL tracking message####
supplychain.tmsintg.ltl.message.route=google-pubsub:${pubsub.supplychain.tmsintg.project-id}:${pubsub.supplychain.tmsintg.ltl.subscription}


#####EDI 990 Configuration####
# Feature toggle for EDI 990 processing
feature.edi990.processing.enabled=true

# GCP PubSub configuration for EDI 990
pubsub.edi990.project-id=mtech-trans-tracking-np
pubsub.edi990.subscription=pull__ibm_sterling_cno_inbound_topic_dev__edi_990_subscriber_dev
#pubsub.edi990.dlq-topic=${EDI990_DLQ_TOPIC}

# EDI 990 consumer route configuration
edi990.consumer.route=google-pubsub:${pubsub.edi990.project-id}:${pubsub.edi990.subscription}?ackMode=AUTO&concurrentConsumers=5&maxAckExtensionPeriod=600

# EDI 990 DLQ route configuration
edi990.dlq.route=google-pubsub:${pubsub.edi990.project-id}:${pubsub.edi990.dlq-topic}

# EDI 990 retry configuration
edi990.retry.attempts=${EDI990_RETRY_ATTEMPTS:3}
edi990.retry.delay=${EDI990_RETRY_DELAY:1000}
