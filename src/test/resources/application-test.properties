tmsphotograbber.sql=select ld_leg_id, carr_cd, srvc_cd, shpg_loc_cd, attach_filename, attach_data from (\
    select ld.ld_leg_id, ld.carr_cd, ld.srvc_cd, s.shpg_loc_cd, af.attach_filename, af.attach_data,\
\           row_number() over (partition by ld.ld_leg_id, ld.carr_cd, s.shpg_loc_cd, af.attach_filename order by ld.ld_leg_id) rw\
\    from ld_leg_t ld\
\    join stop_t s on s.ld_leg_id = ld.ld_leg_id\
\    join tdr_req_t td on td.ld_leg_id = ld.ld_leg_id \
\    join attach_t a on a.attach_entity_code = ld.ld_leg_id\
\    join attach_file_t af on af.attach_file_id = a.attach_file_id\
\    where  ld.srvc_cd in ('IM','TL')\
\    and ld.cur_optlstat_id > 310 /*TENDERED*/\
\    and TO_DATE(trunc(a.UPDATED_DTTM),'DD-MON-YY') = TO_DATE(SYSDATE,'DD-MON-YY')\
\    and td.carr_cd = ld.carr_cd and td.srvc_cd = ld.srvc_cd\
\    and td.srvc_cd = ld.srvc_cd\
\    and td.req_stat_enu not in ('305','315') /*PLANNED,TNDR REJ*/\
\    and af.attach_data is not null\
\    and a.attach_category_enu = 'VNDRCHRGE'\
\    and a.attach_entity_type_enu = 'LOAD'\
\    order by ld.ld_leg_id\
\) where rw = 1


